<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcoom</title>
    <style>
        /* التنسيق العام */
        body {
            background-color: #050505;
            color: #d4d4d4;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 1s ease;
        }

        /* شاشة القفل */
        #login-screen {
            text-align: center;
            background: #0a0a0a;
            padding: 50px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        h2 {
            letter-spacing: 2px;
            font-weight: lighter;
            color: #fff;
        }

        input[type="password"] {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            margin-top: 20px;
            text-align: center;
            width: 200px;
            outline: none;
            transition: border 0.3s;
        }

        input[type="password"]:focus {
            border-color: #777;
        }

        button {
            background: #1a1a1a;
            color: #888;
            border: 1px solid #333;
            padding: 10px 30px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            font-size: 0.8em;
        }

        button:hover {
            background: #fdfdfd;
            color: #000;
            border-color: #fff;
        }

        /* محتوى المعرض */
        #main-content {
            display: none;
            width: 90%;
            max-width: 1100px;
            padding: 60px 0;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 30px;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .gallery-item {
            overflow: hidden;
            border: 1px solid #1a1a1a;
            background: #000;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%);
            transition: 0.7s ease;
        }

        .gallery-item:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        /* تحسين للموبايل */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            #login-screen { width: 80%; padding: 30px; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>PRIVATE</h2>
        <p style="font-size: 0.9em; color: #555;">يرجى إدخال المفتاح السري</p>
        <input type="password" id="passInput" placeholder="······" onkeypress="handleKeyPress(event)">
        <br>
        <button onclick="unlock()">دخول</button>
    </div>

    <div id="main-content">
        <div class="header">
            <h1>اmy potos</h1>
            <p style="font-style: italic; color: #666;">"اf.girly"</p>
        </div>
        
        <div class="gallery">
            <div class="gallery-item"><img src="1.jpg" alt=" 1"></div>
            <div class="gallery-item"><img src="2.jpg" alt=" 2"></div>
            <div class="gallery-item"><img src="3.jpg" alt=" 3"></div>
            <div class="gallery-item"><img src="4.jpg" alt="p 4"></div>
        </div>
    </div>

    <script>
        // دالة الدخول
        function unlock() {
            const pass = document.getElementById("passInput").value;
            // كلمة المرور الافتراضية
            if (pass === "f.socity") { 
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                document.body.style.alignItems = "flex-start";
            } else {
                alert("oui ckon nya siftli t3rf cod.");
            }
        }

        // تشغيل الدخول عند الضغط على Enter
        function handleKeyPress(e) {
            if (e.key === "Enter") {
                unlock();
            }
        }
    </script>
</body>
</html>
