<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Gallery</title>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    
    <style>
        body { background-color: #050505; color: #d4d4d4; font-family: 'Times New Roman', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* شاشة القفل للجميع */
        #login-screen { text-align: center; background: #0a0a0a; padding: 50px; border: 1px solid #1a1a1a; border-radius: 4px; }
        input[type="password"] { background: #111; border: 1px solid #333; color: white; padding: 12px; margin-top: 20px; text-align: center; width: 200px; outline: none; }
        button { background: #1a1a1a; color: #888; border: 1px solid #333; padding: 10px 30px; margin-top: 20px; cursor: pointer; transition: 0.4s; }
        button:hover { background: #fff; color: #000; }

        /* المعرض */
        #main-content { display: none; width: 90%; max-width: 1200px; padding: 40px 0; }
        .header { text-align: center; border-bottom: 1px solid #1a1a1a; padding-bottom: 20px; margin-bottom: 40px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { aspect-ratio: 1/1; overflow: hidden; border: 1px solid #1a1a1a; background: #111; }
        .gallery img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.6s; }
        .gallery-item:hover img { filter: grayscale(0%); transform: scale(1.08); }

        /* إخفاء زر الرفع تماماً في البداية */
        #upload-btn { 
            display: none; 
            background: #b71c1c; 
            color: #fff; 
            border: 1px solid #ff5252; 
            margin: 20px auto;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>PRIVATE ACCESS</h2>
        <input type="password" id="passInput" placeholder="······" onkeypress="if(event.key==='Enter') unlock()">
        <br>
        <button onclick="unlock()">Login</button>
    </div>

    <div id="main-content">
        <div class="header">
            <h1>MY GALLERY</h1>
            <!-- زر الرفع الذي لن يظهر إلا لك -->
            <button id="upload-btn">➕ لوحة تحكم المسؤول: إضافة صورة</button>
        </div>
        
        <div class="gallery" id="photo-gallery">
            <!-- الصور هنا -->
            <div class="gallery-item"><img src="1.jpg"></div>
        </div>
    </div>

    <script>
        // 1. وظيفة التحقق من الرابط (هل أنت المسؤول؟)
        function checkAdminStatus() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true') {
                document.getElementById("upload-btn").style.display = "block";
            }
        }

        function unlock() {
            const pass = document.getElementById("passInput").value;
            if (pass === "f.socity") { 
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                checkAdminStatus(); // فحص هل يجب إظهار زر الرفع
            } else {
                alert("رمز الدخول خاطئ.");
            }
        }

        // 2. إعدادات الرفع الخاصة بك
        const myWidget = cloudinary.createUploadWidget({
            cloudName: 'dm6sw4fb1', 
            uploadPreset: 'jalile.mh'
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                const gallery = document.getElementById("photo-gallery");
                const newItem = document.createElement("div");
                newItem.className = "gallery-item";
                newItem.innerHTML = `<img src="${result.info.secure_url}">`;
                gallery.prepend(newItem); 
                alert("تم رفع الصورة بنجاح!");
            }
        });

        document.getElementById("upload-btn").addEventListener("click", () => myWidget.open());
    </script>
</body>
</html>
