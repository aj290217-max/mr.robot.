<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gallery | mr.robot.</title>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    <style>
        :root { --main-bg: #050505; --accent: #b71c1c; --text: #d4d4d4; }
        body { background: var(--main-bg); color: var(--text); font-family: 'Times New Roman', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        /* شاشة الدخول */
        #login-screen { text-align: center; background: #0a0a0a; padding: 50px; border: 1px solid #1a1a1a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input[type="password"] { background: #111; border: 1px solid #333; color: white; padding: 12px; margin-top: 20px; text-align: center; width: 200px; outline: none; }
        button { background: #1a1a1a; color: #888; border: 1px solid #333; padding: 10px 30px; margin-top: 20px; cursor: pointer; transition: 0.4s; }
        button:hover { background: #fff; color: #000; }

        /* المعرض */
        #main-content { display: none; width: 95%; max-width: 1200px; padding: 40px 0; }
        .header { text-align: center; border-bottom: 1px solid #1a1a1a; padding-bottom: 20px; margin-bottom: 40px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .gallery-item { aspect-ratio: 1/1; overflow: hidden; border: 1px solid #1a1a1a; background: #111; position: relative; }
        .gallery img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.6s; }
        .gallery-item:hover img { filter: grayscale(0%); transform: scale(1.05); }

        /* لوحة التحكم */
        #admin-panel { display: none; text-align: center; margin-bottom: 30px; padding: 20px; border: 1px dashed #333; }
        .btn-upload { background: var(--accent); color: white; border: none; font-weight: bold; }
        .copy-hint { font-size: 0.8em; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>SYSTEM LOCKED</h2>
        <p style="color: #444; font-size: 0.8em;">PROJECT: MR.ROBOT.</p>
        <input type="password" id="passInput" placeholder="PASSKEY" onkeypress="if(event.key==='Enter') unlock()">
        <br>
        <button onclick="unlock()">ACCESS</button>
    </div>

    <div id="main-content">
        <div class="header">
            <h1>PRIVATE GALLERY</h1>
            <div id="admin-panel">
                <button class="btn-upload" id="upload-btn">➕ UPLOAD NEW IMAGE</button>
                <p class="copy-hint">الصور ترفع على Cloudinary وتُحفظ في ذاكرة هذا المتصفح.</p>
            </div>
        </div>
        
        <div class="gallery" id="photo-gallery"></div>
    </div>

    <script>
        // الإعدادات (آمنة تماماً)
        const CLOUD_NAME = 'dm6sw4fb1';
        const UPLOAD_PRESET = 'jalile.mh';

        // 1. فتح الموقع بكلمة السر
        function unlock() {
            const pass = document.getElementById("passInput").value;
            if (pass === "f.socity") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                
                loadFromStorage(); // جلب الصور من ذاكرة المتصفح
                
                // إظهار زر الرفع فقط عبر الرابط السرّي ?admin=true
                if (new URLSearchParams(window.location.search).get('admin') === 'true') {
                    document.getElementById("admin-panel").style.display = "block";
                }
            } else { alert("ACCESS DENIED"); }
        }

        // 2. إدارة التخزين (لتبقى الصور هناك)
        function saveImageUrl(url) {
            let photos = JSON.parse(localStorage.getItem('my_photos') || '[]');
            photos.push(url);
            localStorage.setItem('my_photos', JSON.stringify(photos));
        }

        function loadFromStorage() {
            let photos = JSON.parse(localStorage.getItem('my_photos') || '[]');
            photos.reverse().forEach(url => displayImage(url));
        }

        function displayImage(url) {
            const gallery = document.getElementById("photo-gallery");
            const div = document.createElement("div");
            div.className = "gallery-item";
            div.innerHTML = `<img src="${url}" onclick="window.open('${url}', '_blank')">`;
            gallery.prepend(div);
        }

        // 3. إعداد الرفع عبر Cloudinary
        const myWidget = cloudinary.createUploadWidget({
            cloudName: CLOUD_NAME, 
            uploadPreset: UPLOAD_PRESET
        }, (error, result) => {
            if (!error && result.event === "success") {
                const url = result.info.secure_url;
                displayImage(url);
                saveImageUrl(url); // الحفظ في ذاكرة المتصفح
                console.log("Image URL:", url);
            }
        });

        document.getElementById("upload-btn").addEventListener("click", () => myWidget.open());
    </script>
</body>
</html>
