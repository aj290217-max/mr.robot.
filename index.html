
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Robot Gallery</title>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        body { background: #050505; color: #d4d4d4; font-family: serif; text-align: center; margin: 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 20px; }
        .gallery img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border: 1px solid #1a1a1a; filter: grayscale(100%); transition: 0.5s; }
        .gallery img:hover { filter: grayscale(0%); }
        #admin-btn { display: none; margin: 20px; padding: 10px 20px; background: #b71c1c; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>GALLERY</h1>
    <!-- الزر سيظهر فقط عند إضافة ?admin=true للرابط -->
    <button id="admin-btn">➕ ارفع صورة جديدة</button>

    <div class="gallery" id="gallery-container"></div>

    <script>
        // --- ضع روابط صورك هنا لكي تظهر في كل الهواتف ---
        const myImages = [
            "رابط_الصورة_الأولى",
            "رابط_الصورة_الثانية"
        ];

        // عرض الصور للجميع
        const container = document.getElementById("gallery-container");
        myImages.reverse().forEach(url => {
            const img = document.createElement("img");
            img.src = url;
            container.appendChild(img);
        });

        // إظهار زر الرفع للمسؤول
        if (new URLSearchParams(window.location.search).get('admin') === 'true') {
            document.getElementById("admin-btn").style.display = "inline-block";
        }

        // إعداد الرفع (سيعطيك الرابط لتضعه في الكود)
        const myWidget = cloudinary.createUploadWidget({
            cloudName: 'dm6sw4fb1', 
            uploadPreset: 'jalile.mh'
        }, (error, result) => {
            if (!error && result.event === "success") {
                const url = result.info.secure_url;
                alert("تم الرفع! انسخ هذا الرابط وضعه في ملف index.html داخل قائمة myImages:\n\n" + url);
            }
        });

        document.getElementById("admin-btn").addEventListener("click", () => myWidget.open());
    </script>
</body>
</html>
